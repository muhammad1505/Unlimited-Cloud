org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true

# --- App version (single source of truth) -------------------------------------
# The Android APK, the desktop package, the About card, TDLib's
# application_version and the post-update changelog dialog all read this value.
# versionCode is derived as major*10000 + minor*100 + patch.
# Bump with: python3 scripts/bump-version.py <major.minor.patch>
unlimitedcloud.versionName=1.2.5
