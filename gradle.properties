org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 rejects com.android.application together with org.jetbrains.kotlin.multiplatform
# since 9.0. These are the documented compatibility flags that keep the single-module
# composeApp launcher working; a KMP library module + thin app module split can replace
# them later.
android.builtInKotlin=false
android.newDsl=false
